name: Security

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071
        # RUSTSEC-2023-0071 (rsa 0.9.10, medium 5.9): pulled transitively via
        #   sqlx-mysql, a target-specific dep. Rungu uses SQLite only — rsa is
        #   never compiled in. No fixed upgrade available upstream.
        # RUSTSEC-2026-0009 (time DoS): resolved in v0.2.0 — time bumped to
        #   0.3.47+ after MSRV moved to 1.88.

  bun-audit:
    name: Bun Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      # Accepted risk, tracked in #281. Review by 2027-02-18, or earlier when
      # SvelteKit 3 is adopted or picomatch ships a fix.
      #
      # None of these is reachable in the shipped product: the SPA is built with
      # adapter-static and embedded in the Rust binary, so no SvelteKit server
      # runs in production, and the code uses no remote functions, form actions,
      # server routes or hooks.
      #   GHSA-3r8g-jcqq-3p5j  SvelteKit remote `form` parsing (server only)
      #   GHSA-6cf5-gc4q-fm3x  SvelteKit `query.batch` (remote functions, server only)
      #   GHSA-fc5q-39xc-vjpf  picomatch ReDoS (build and test tooling only)
      # Re-evaluate if the app starts using SSR or remote functions.
      - run: >-
          bun audit --audit-level=moderate
          --ignore=GHSA-3r8g-jcqq-3p5j
          --ignore=GHSA-6cf5-gc4q-fm3x
          --ignore=GHSA-fc5q-39xc-vjpf

  trivy-fs:
    name: Trivy Filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  trivy-secrets:
    name: Trivy Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          exit-code: '1'
