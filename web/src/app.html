<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Favicon: lucide "shield" glyph in brand blue (matches the 🛡️ wordmark) -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/%3E%3C/svg%3E"
        />
        <script>
            // Prevent flash of wrong theme — runs before page render.
            // Mirrors the logic in src/lib/theme.ts: 'system' resolves via the
            // OS preference, so we must NOT treat a stored 'system' value as a
            // concrete dark choice (that caused a dark→light flash for
            // system + light-OS users).
            (function () {
                try {
                    var stored = localStorage.getItem('rungu-theme');
                    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var isDark =
                        stored === 'dark' ||
                        ((!stored || stored === 'system') && prefersDark);
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {
                    // localStorage unavailable (incognito, disabled) — follow OS only.
                }
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
